[project]
name = "musical-sniffle"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg==0.30.0",
    "bcrypt==4.2.1",
    "email-validator==2.2.0",
    "fastapi==0.115.12",
    "httpx==0.28.1",
    "pgvector==0.3.6",
    "psycopg2-binary==2.9.10",
    "pydantic-settings==2.9.1",
    "pyjwt==2.10.1",
    "python-dotenv==1.1.0",
    "python-jose==3.3.0",
    "python-multipart>=0.0.26",
    "sqlalchemy[asyncio]==2.0.40",
    "uvicorn[standard]==0.34.2",
    "transformers",
    "torch",
    "sentencepiece",
    "protobuf",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "faker>=40.23.0",
    "freezegun>=1.5.5",
    "mypy>=2.1.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "respx>=0.23.1",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

